<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archival Play | Vintage Happy Meal & Retro Toys</title>
    
    <!-- SEO & Accessibility Search Description -->
    <meta name="description" content="Relive your childhood with our curated collection of vintage McDonald's and retro Happy Meal toys. Carefully collected, safely shipped.">
    
    <!-- Link to external AAA Compliant Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Accessible skip link (visible only on keyboard tab focus) -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Header & Navigation Area (Populated dynamically from nav.html) -->
    <div id="main-header"></div>

    <!-- Main Content Area -->
    <main id="main-content">
        
        <!-- Nostalgic Hero Section -->
        <section aria-labelledby="hero-heading" class="hero-section">
            <h1 id="hero-heading">Bring Home a Piece of Your Childhood</h1>
            <p>Explore a carefully curated archive of rare McDonald's toys from decades of family collecting.</p>
            <a href="#featured-heading" class="btn">Browse the Archive</a>
        </section>

        <!-- Featured Products Grid -->
        <section aria-labelledby="featured-heading">
            <h2 id="featured-heading">Featured Collectibles</h2>
            
            <!-- Dynamic Container: JavaScript will populate products here from toys.json -->
            <div id="product-grid" class="product-grid"></div>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Archival Play. Dedicated to preserving play.</p>
    </footer>

    <!-- JavaScript Files -->
    <script src="nav-loader.js"></script>
    <script src="app.js"></script>
</body>
</html>
